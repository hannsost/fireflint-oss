# Isolated local release fixture. No published database/API port; no demo seed.
# Invoke with: docker compose -p YOUR_UNIQUE_PROJECT -f deploy/saas/compose.yaml ...
x-runtime: &runtime
  APP_ENV: production
  SITEGRAPH_LOAD_DOTENV: "0"
  DATABASE_URL: postgresql://fireflint:${FIXTURE_DB_PASSWORD:?Set a hex-only fixture DB password}@db:5432/fireflint
  JWT_SECRET: ${FIXTURE_JWT_SECRET:?Set a strong fixture JWT secret}
  AI_CONNECTOR_ENCRYPTION_KEY: ${FIXTURE_AI_KEY:?Set a persistent fixture encryption key}
  # The browser uses one HTTP loopback origin; no cross-origin request is made.
  # Keep the production HTTPS-only allowlist guard exercised in this fixture.
  CORS_ALLOWED_ORIGINS: https://localhost:${FIXTURE_HTTP_PORT:-18080}
  WEBHOOK_ALLOW_PRIVATE: "false"
x-api: &api
  image: fireflint-api:fixture
  build: { context: ../.., dockerfile: deploy/saas/api.Dockerfile }
  environment: *runtime
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: fireflint
      POSTGRES_DB: fireflint
      POSTGRES_PASSWORD: ${FIXTURE_DB_PASSWORD:?Set a hex-only fixture DB password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *api
    command: [migrate]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *api
    command: [serve]
    environment:
      <<: *runtime
      BIND: 0.0.0.0:8080
      ASSET_DIR: /var/lib/fireflint/assets
    volumes: [assets:/var/lib/fireflint/assets]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 200s
  admin:
    image: fireflint-admin:fixture
    build: { context: ../.., dockerfile: deploy/saas/admin.Dockerfile }
    environment: { API_UPSTREAM: "api:8080" }
    ports: ["127.0.0.1:${FIXTURE_HTTP_PORT:-18080}:8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]
    depends_on: [api]
  bootstrap:
    <<: *api
    profiles: [bootstrap]
    command: [bootstrap-admin]
    environment:
      <<: *runtime
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_ORG_NAME: ${BOOTSTRAP_ADMIN_ORG_NAME:-}
      BOOTSTRAP_ADMIN_ORG_SLUG: ${BOOTSTRAP_ADMIN_ORG_SLUG:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata: {}
  assets: {}
networks:
  private: { internal: true }
