apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fireflint.name" . }}-admin
  labels: {{- include "fireflint.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ include "fireflint.name" . }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "fireflint.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: {{ include "fireflint.image" .Values.admin.image | quote }}
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-api:8080" (include "fireflint.name" .) | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources: {{- toYaml .Values.admin.resources | nindent 12 }}
          securityContext: {{- include "fireflint.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
